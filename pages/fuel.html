<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Fuel Tools</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="../css/fuel.css">

</head>

<body class="theme-red">

<div class="app">

    <header class="fuel-header">

        <div class="fuel-title">

            <h1>Fuel Tools</h1>

            <p>Jet A-1 Fuel Converter</p>

        </div>

        <a href="../index.html" class="secondary-button">
            Home
        </a>

    </header>

    <main class="page-fuel">

        <section class="fuel-card">

            <div class="input-group">

                <label for="density">
                    Density
                </label>

                <input
                        id="density"
                        type="number"
                        step="0.001"
                        inputmode="decimal">

            </div>

            <div class="input-group">

                <label for="kg">
                    Kilograms
                </label>

                <input
                        id="kg"
                        type="number"
                        step="0.001"
                        inputmode="decimal">

            </div>

            <div class="input-group">

                <label for="litres">
                    Litres
                </label>

                <input
                        id="litres"
                        type="number"
                        step="0.001"
                        inputmode="decimal">

            </div>

            <div class="input-group">

                <label for="usGallons">
                    US Gallons
                </label>

                <input
                        id="usGallons"
                        type="number"
                        step="0.001"
                        inputmode="decimal">

            </div>

            <div class="input-group">

                <label for="impGallons">
                    Imperial Gallons
                </label>

                <input
                        id="impGallons"
                        type="number"
                        step="0.001"
                        inputmode="decimal">

            </div>

            <div class="button-row">

                <button
                        id="copyButton"
                        class="primary-button">

                    Copy

                </button>

                <button
                        id="resetButton"
                        class="secondary-button">

                    Reset

                </button>

            </div>

        </section>

    </main>

</div>

<script src="../js/fuel.js"></script>

</body>

</html>
