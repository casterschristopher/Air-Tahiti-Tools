<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fuel Tools</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/fuel.css?v=5"></head><body><div class="fuel-page-transition" aria-hidden="true"></div><div class="app"><header class="page-header"><button class="back-button" type="button" onclick="history.back()">←</button><div><h1 class="page-title">Fuel Tools</h1><p class="page-subtitle">Fuel quantity & conversions</p></div></header><main class="fuel-content">
<section class="card fuel-card fuel-uplift-card"><div class="card-header"><div><h2 class="card-title">✈️ Fuel à rajouter</h2><p class="card-subtitle">Calcule la quantité à ajouter à l'avion</p></div></div><div class="card-body"><div class="two-inputs"><div class="input-group"><label for="fuelOnboard">Disponible</label><div class="input-with-unit"><input type="number" id="fuelOnboard" class="input" placeholder="0" min="0" step="0.1"><span class="input-unit">kg</span></div></div><div class="input-group"><label for="fuelRequired">Désiré</label><div class="input-with-unit"><input type="number" id="fuelRequired" class="input" placeholder="0" min="0" step="0.1"><span class="input-unit">kg</span></div></div></div><div class="result-card result-highlight"><span class="result-label">À rajouter</span><span id="fuelUploadResult" class="result-value">0.0</span><span class="result-unit">kg</span><div id="upliftConversions" class="result-conversions">— L&nbsp;&nbsp;•&nbsp;&nbsp;— US gal</div></div></div></section>
<section class="card fuel-card"><div class="card-header"><div><h2 class="card-title">🔄 Conversion Fuel</h2><p class="card-subtitle">kg, litres et US gallons</p></div></div><div class="card-body"><div class="input-group"><label for="fuelQuantity">Valeur</label><input type="number" id="fuelQuantity" class="input" placeholder="0" min="0" step="0.01"></div><div class="conversion-row"><div class="input-group"><label for="fuelUnit">De</label><select id="fuelUnit" class="input"><option value="kg">Kilogrammes (kg)</option><option value="l">Litres (L)</option><option value="usgal">US Gallons</option></select></div><div class="swap-symbol">→</div><div class="input-group"><label for="fuelToUnit">Vers</label><select id="fuelToUnit" class="input"><option value="l">Litres (L)</option><option value="kg">Kilogrammes (kg)</option><option value="usgal">US Gallons</option></select></div></div><div class="result-card"><span class="result-label">Résultat</span><span id="fuelResult" class="result-value">0.00</span><span id="fuelResultUnit" class="result-unit">L</span></div></div></section>
<section class="card fuel-card"><div class="card-header"><div><h2 class="card-title">🛢️ Fuel Density</h2><p class="card-subtitle">Densité utilisée pour les conversions</p></div><div id="densityStatus" class="density-status status-waiting"><span class="status-dot"></span><span id="densityStatusText">À renseigner</span></div></div><div class="card-body"><div class="input-group"><label for="fuelDensity">Fuel Density @15°C</label><div class="input-with-unit"><input type="number" id="fuelDensity" class="input" placeholder="0.7980" step="0.0001" min="0"><span class="input-unit">kg/L</span></div></div></div></section>
<section class="fuel-actions"><button id="resetFuel" class="btn btn-secondary" type="button">Reset</button></section></main></div><script src="../js/app.js?v=8"></script><script src="../js/fuel.js?v=5"></script><script>(function(){const body=document.body;body.classList.add('page-enter');requestAnimationFrame(function(){body.classList.add('page-enter-active')});window.addEventListener('pageshow',function(){body.classList.add('page-enter-active')});const back=document.querySelector('.back-button');if(back)back.addEventListener('click',function(e){e.preventDefault();body.classList.remove('page-enter-active');body.classList.add('page-exit');setTimeout(function(){history.back()},280)});})();</script></body></html>
