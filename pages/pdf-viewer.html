<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Lecteur PDF • Air Tahiti Tools</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/components.css"><style>:root{--bg:#07111f;--panel:#102033;--line:#ffffff18;--text:#f4f7fa;--muted:#aebdcd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.viewer{height:100dvh;display:flex;flex-direction:column}.toolbar{min-height:58px;padding:7px 9px;display:flex;align-items:center;gap:7px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}.tool{height:42px;min-width:42px;border:1px solid var(--line);border-radius:12px;background:#ffffff0d;color:var(--text);font-size:19px}.title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pagebox{display:flex;align-items:center;gap:4px}.pagebox input{width:52px;height:38px;border:1px solid var(--line);border-radius:10px;background:#ffffff0d;color:var(--text);text-align:center}.searchbar{display:none;padding:7px 9px;background:#0b1929;border-bottom:1px solid var(--line);gap:7px}.searchbar.open{display:flex}.searchbar input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:11px;background:#ffffff0d;color:#fff;padding:0 12px;font-size:.9rem}.content{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}.sidebar{width:min(82vw,330px);height:100%;position:absolute;left:0;top:0;z-index:8;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-101%);transition:transform .25s ease;overflow:auto;padding:12px}.sidebar.open{transform:translateX(0)}.sidebar h2{font-size:1rem;margin:5px}.outline-item{display:block;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:.78rem;text-align:left}.outline-item:active{background:#ffffff12;color:#fff}.canvas-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#263445;padding:18px 8px 40px}.page{width:max-content;margin:0 auto 16px;background:#fff;box-shadow:0 5px 22px #0006}.page canvas{display:block}.loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#07111ff5;font-size:.9rem;padding:20px;text-align:center}.loading.hidden{display:none}.empty{color:var(--muted);text-align:center;padding:30px 15px;font-size:.85rem}@media(min-width:700px){.sidebar{position:relative;transform:none;width:280px;flex-shrink:0}.canvas-wrap{padding:24px}}</style></head><body><div class="viewer"><div class="toolbar"><button class="tool" id="back">←</button><button class="tool" id="outlineBtn">☰</button><div class="title" id="title">Document PDF</div><button class="tool" id="searchBtn">⌕</button><div class="pagebox"><input id="pageInput" inputmode="numeric" value="1"><span>/ <b id="pageCount">—</b></span></div></div><div class="searchbar" id="searchbar"><input id="searchInput" type="search" placeholder="Rechercher dans le PDF…"><button class="tool" id="prevMatch">↑</button><button class="tool" id="nextMatch">↓</button><button class="tool" id="closeSearch">×</button></div><div class="content"><aside class="sidebar" id="sidebar"><h2>Arborescence</h2><div id="outline"><div class="empty">Chargement…</div></div></aside><main class="canvas-wrap" id="canvasWrap"><div id="pages"></div></main></div></div><div class="loading" id="loading">Chargement du lecteur PDF…</div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>const p=new URLSearchParams(location.search),src=p.get('file'),docTitle=p.get('title')||'Document PDF';const $=id=>document.getElementById(id),pages=$('pages'),wrap=$('canvasWrap'),loading=$('loading'),sidebar=$('sidebar'),outline=$('outline');$('title').textContent=docTitle;document.title=docTitle+' • Air Tahiti Tools';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=null,scale=1.15,current=1,rendered=new Map(),matches=[],mi=-1;function back(){history.length>1?history.back():location.href='documentation.html?v=5'}$('back').onclick=back;$('outlineBtn').onclick=()=>sidebar.classList.toggle('open');$('searchBtn').onclick=()=>{const s=$('searchbar');s.classList.toggle('open');if(s.classList.contains('open'))setTimeout(()=>$('searchInput').focus(),50)};$('closeSearch').onclick=()=>$('searchbar').classList.remove('open');$('pageInput').onchange=()=>goto(+$('pageInput').value||1);async function render(n){if(!pdf||n<1||n>pdf.numPages)return;let h=rendered.get(n);if(h)return h;const page=await pdf.getPage(n),v=page.getViewport({scale});h=document.createElement('div');h.className='page';h.dataset.page=n;const c=document.createElement('canvas');h.appendChild(c);pages.appendChild(h);c.width=Math.floor(v.width);c.height=Math.floor(v.height);await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;rendered.set(n,h);return h}async function goto(n){n=Math.max(1,Math.min(pdf.numPages,n));const h=await render(n);h.scrollIntoView({behavior:'smooth',block:'start'});current=n;$('pageInput').value=n}function observe(){new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const n=+e.target.dataset.page;current=n;$('pageInput').value=n;[n-2,n-1,n+1,n+2].forEach(x=>x>0&&x<=pdf.numPages&&render(x))}}),{root:wrap,rootMargin:'900px'});const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const n=+e.target.dataset.page;current=n;$('pageInput').value=n;[n-2,n-1,n+1,n+2].forEach(x=>x>0&&x<=pdf.numPages&&render(x))}}),{root:wrap,rootMargin:'900px'});[...pages.children].forEach(x=>o.observe(x))}async function makeOutline(){const a=await pdf.getOutline();outline.innerHTML='';if(!a||!a.length){outline.innerHTML='<div class="empty">Aucune arborescence intégrée à ce PDF.</div>';return}function add(items,box){items.forEach(it=>{const b=document.createElement('button');b.className='outline-item';b.textContent=it.title;b.onclick=async()=>{try{const d=await pdf.getDestination(it.dest);const num=d&&d[0]?await pdf.getPageIndex(d[0])+1:1;await goto(num);if(innerWidth<700)sidebar.classList.remove('open')}catch(e){console.error(e)}};box.appendChild(b);if(it.items&&it.items.length){const sub=document.createElement('div');sub.style.marginLeft='10px';box.appendChild(sub);add(it.items,sub)}})}add(a,outline)}async function search(q){q=q.trim().toLowerCase();matches=[];mi=-1;if(!q)return;for(let n=1;n<=pdf.numPages;n++){const t=await pdf.getPage(n).then(x=>x.getTextContent());if(t.items.map(x=>x.str).join(' ').toLowerCase().includes(q))matches.push(n)}$('searchInput').placeholder=matches.length?matches.length+' résultat'+(matches.length>1?'s':''):'Aucun résultat';if(matches.length){mi=0;goto(matches[0])}}let timer;$('searchInput').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),400)};$('nextMatch').onclick=()=>{if(matches.length){mi=(mi+1)%matches.length;goto(matches[mi])}};$('prevMatch').onclick=()=>{if(matches.length){mi=(mi-1+matches.length)%matches.length;goto(matches[mi])}};if(!src){loading.textContent='PDF introuvable';throw new Error('file manquant')}pdfjsLib.getDocument({url:src}).promise.then(async x=>{pdf=x;$('pageCount').textContent=pdf.numPages;$('pageInput').max=pdf.numPages;await makeOutline();for(let i=1;i<=Math.min(5,pdf.numPages);i++)await render(i);observe();loading.classList.add('hidden')}).catch(e=>{console.error(e);loading.textContent='Impossible de charger ce PDF. Vérifie ta connexion puis recharge la page.'});</script></body></html>
