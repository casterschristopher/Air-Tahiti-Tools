<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Lecteur PDF • Air Tahiti Tools</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/components.css"><style>
:root{--pdf-bg:#07111f;--pdf-panel:#102033;--pdf-border:#ffffff18;--pdf-text:#f4f7fa;--pdf-muted:#aebdcd;--pdf-accent:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--pdf-bg);color:var(--pdf-text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.viewer{height:100dvh;display:flex;flex-direction:column}.toolbar{height:auto;min-height:58px;padding:7px 9px;display:flex;align-items:center;gap:7px;background:var(--pdf-panel);border-bottom:1px solid var(--pdf-border);z-index:10}.tool{height:42px;min-width:42px;border:1px solid var(--pdf-border);border-radius:12px;background:#ffffff0d;color:var(--pdf-text);font-size:19px;display:flex;align-items:center;justify-content:center}.tool:active{transform:scale(.97)}.title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pagebox{display:flex;align-items:center;gap:4px}.pagebox input{width:52px;height:38px;border:1px solid var(--pdf-border);border-radius:10px;background:#ffffff0d;color:var(--pdf-text);text-align:center;font-size:.9rem}.pagebox span{font-size:.72rem;color:var(--pdf-muted)}.searchbar{display:none;padding:7px 9px;background:#0b1929;border-bottom:1px solid var(--pdf-border);gap:7px}.searchbar.open{display:flex}.searchbar input{flex:1;min-width:0;height:40px;border:1px solid var(--pdf-border);border-radius:11px;background:#ffffff0d;color:#fff;padding:0 12px;font-size:.9rem;outline:none}.searchbar button{height:40px;width:40px;border:1px solid var(--pdf-border);border-radius:11px;background:#ffffff0d;color:#fff}.content{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}.sidebar{width:min(82vw,330px);height:100%;position:absolute;left:0;top:0;bottom:0;z-index:8;background:var(--pdf-panel);border-right:1px solid var(--pdf-border);transform:translateX(-101%);transition:transform .25s ease;overflow:auto;padding:12px}.sidebar.open{transform:translateX(0)}.sidebar h2{font-size:1rem;margin:5px 5px 12px}.outline-item{display:block;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:var(--pdf-muted);font-size:.78rem;line-height:1.3}.outline-item:hover,.outline-item:active{background:#ffffff0d;color:#fff}.canvas-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#263445;padding:18px 10px 40px}.page{position:relative;margin:0 auto 16px;background:#fff;box-shadow:0 5px 22px #0006;width:max-content}.page canvas{display:block}.loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#07111ff2;font-size:.9rem}.loading.hidden{display:none}.empty{color:#aebdcd;text-align:center;padding:30px 15px;font-size:.85rem}.zoom{display:none}@media(min-width:700px){.toolbar{padding-left:14px;padding-right:14px}.canvas-wrap{padding:24px}.sidebar{position:relative;transform:none;width:280px;flex-shrink:0}.zoom{display:flex}}
</style></head><body><div class="viewer"><div class="toolbar"><button class="tool" id="back" aria-label="Retour">←</button><button class="tool" id="outlineBtn" aria-label="Arborescence">☰</button><div class="title" id="title">Document PDF</div><button class="tool" id="searchBtn" aria-label="Rechercher">⌕</button><button class="tool zoom" id="zoomOut" aria-label="Zoom arrière">−</button><button class="tool zoom" id="zoomIn" aria-label="Zoom avant">+</button><div class="pagebox"><input id="pageInput" inputmode="numeric" aria-label="Numéro de page" value="1"><span>/ <b id="pageCount">—</b></span></div></div><div class="searchbar" id="searchbar"><input id="searchInput" type="search" placeholder="Rechercher dans le PDF…" autocomplete="off"><button id="prevMatch" aria-label="Résultat précédent">↑</button><button id="nextMatch" aria-label="Résultat suivant">↓</button><button id="closeSearch" aria-label="Fermer">×</button></div><div class="content"><aside class="sidebar" id="sidebar"><h2>Arborescence</h2><div id="outline"><div class="empty">Chargement…</div></div></aside><main class="canvas-wrap" id="canvasWrap"><div id="pages"></div></main></div></div><div class="loading" id="loading">Chargement du document…</div><script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const params=new URLSearchParams(location.search);const src=params.get('file');const title=params.get('title')||'Document PDF';const pagesEl=document.getElementById('pages');const wrap=document.getElementById('canvasWrap');const loading=document.getElementById('loading');const pageInput=document.getElementById('pageInput');const pageCount=document.getElementById('pageCount');const titleEl=document.getElementById('title');const sidebar=document.getElementById('sidebar');const outlineEl=document.getElementById('outline');let pdf=null,scale=1.25,current=1,rendered=new Map(),matches=[],matchIndex=-1;
titleEl.textContent=title;document.title=title+' • Air Tahiti Tools';
function goBack(){if(history.length>1)history.back();else location.href='documentation.html?v=4'}document.getElementById('back').onclick=goBack;document.getElementById('outlineBtn').onclick=()=>sidebar.classList.toggle('open');
document.getElementById('searchBtn').onclick=()=>{document.getElementById('searchbar').classList.toggle('open');if(document.getElementById('searchbar').classList.contains('open'))setTimeout(()=>document.getElementById('searchInput').focus(),50)};document.getElementById('closeSearch').onclick=()=>document.getElementById('searchbar').classList.remove('open');
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.5,scale+.15);rerender()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.65,scale-.15);rerender()};pageInput.onchange=()=>scrollToPage(Number(pageInput.value)||1);
async function renderPage(num){if(!pdf||num<1||num>pdf.numPages)return;let holder=rendered.get(num);if(holder)return holder;const page=await pdf.getPage(num);const viewport=page.getViewport({scale});holder=document.createElement('div');holder.className='page';holder.dataset.page=num;const canvas=document.createElement('canvas');holder.appendChild(canvas);pagesEl.appendChild(holder);const ctx=canvas.getContext('2d',{alpha:false});canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;rendered.set(num,holder);return holder}
async function renderInitial(){for(let i=1;i<=Math.min(pdf.numPages,5);i++)await renderPage(i);observe();loading.classList.add('hidden')}
let observer;function observe(){observer?.disconnect();observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const n=Number(e.target.dataset.page);current=n;pageInput.value=n;for(const x of [n-2,n-1,n+1,n+2])if(x>0&&x<=pdf.numPages)renderPage(x)}}),{root:wrap,rootMargin:'900px 0px'});[...pagesEl.children].forEach(x=>observer.observe(x))}
async function scrollToPage(n){n=Math.max(1,Math.min(pdf.numPages,n));const el=await renderPage(n);el.scrollIntoView({behavior:'smooth',block:'start'});current=n;pageInput.value=n}
async function rerender(){const target=current;pagesEl.innerHTML='';rendered.clear();await renderPage(target);for(const n of [target-2,target-1,target+1,target+2])if(n>0&&n<=pdf.numPages)await renderPage(n);observe();scrollToPage(target)}
function labelForDest(dest){return Array.isArray(dest)?dest[0]:dest}
async function buildOutline(){const outline=await pdf.getOutline();outlineEl.innerHTML='';if(!outline?.length){outlineEl.innerHTML='<div class="empty">Aucune arborescence intégrée à ce PDF.</div>';return}function add(items,container){items.forEach(item=>{const b=document.createElement('button');b.className='outline-item';b.textContent=item.title;b.onclick=async()=>{try{const dest=await pdf.getDestination(item.dest);const ref=dest?.[0];const pageNum=ref?(await pdf.getPageIndex(ref))+1:1;await scrollToPage(pageNum);if(innerWidth<700)sidebar.classList.remove('open')}catch(e){}};container.appendChild(b);if(item.items?.length){const sub=document.createElement('div');sub.style.marginLeft='10px';container.appendChild(sub);add(item.items,sub)}})}add(outline,outlineEl)}
async function search(q){q=q.trim().toLowerCase();matches=[];matchIndex=-1;if(!q)return;for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n);const text=await p.getTextContent();const s=text.items.map(x=>x.str).join(' ').toLowerCase();if(s.includes(q))matches.push(n)}if(matches.length){matchIndex=0;await scrollToPage(matches[0]);document.getElementById('searchInput').setAttribute('placeholder',`${matches.length} résultat${matches.length>1?'s':''}`)}else document.getElementById('searchInput').setAttribute('placeholder','Aucun résultat')}
let searchTimer;document.getElementById('searchInput').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(e.target.value),350)};document.getElementById('nextMatch').onclick=()=>{if(matches.length){matchIndex=(matchIndex+1)%matches.length;scrollToPage(matches[matchIndex])}};document.getElementById('prevMatch').onclick=()=>{if(matches.length){matchIndex=(matchIndex-1+matches.length)%matches.length;scrollToPage(matches[matchIndex])}};
if(!src){loading.textContent='Document PDF introuvable';throw new Error('Missing file parameter')}
try{pdf=await pdfjsLib.getDocument({url:src,disableAutoFetch:false}).promise;pageCount.textContent=pdf.numPages;pageInput.max=pdf.numPages;await buildOutline();await renderInitial()}catch(e){console.error(e);loading.textContent='Impossible de charger le PDF'}
</script></body></html>
