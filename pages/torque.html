<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Torque & Units</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="../css/torque.css">

</head>

<body class="theme-red">

<div class="app">

    <header class="fuel-header">

        <div class="fuel-title">

            <h1>Torque & Units</h1>

            <p>Aircraft Maintenance Conversions</p>

        </div>

        <a href="../index.html" class="secondary-button">
            Home
        </a>

    </header>

    <main class="page-fuel">

        <section class="fuel-card">

            <div class="input-group">

                <label for="category">
                    Conversion
                </label>

                <select id="category">

                    <option value="torque">Torque</option>

                    <option value="length">Length</option>

                    <option value="pressure">Pressure</option>

                    <option value="mass">Mass</option>

                    <option value="temperature">Temperature</option>

                </select>

            </div>

            <div class="input-group">

                <label for="value">
                    Value
                </label>

                <input
                    id="value"
                    type="number"
                    step="0.001"
                    inputmode="decimal">

            </div>

            <div class="input-group">

                <label for="fromUnit">
                    From
                </label>

                <select id="fromUnit"></select>

            </div>

            <div class="input-group">

                <label for="toUnit">
                    To
                </label>

                <select id="toUnit"></select>

            </div>

            <div class="input-group">

                <label>
                    Result
                </label>

                <input
                    id="result"
                    readonly>

            </div>

            <div class="button-row">

                <button
                    id="copyButton"
                    class="primary-button">

                    Copy

                </button>

                <button
                    id="resetButton"
                    class="secondary-button">

                    Reset

                </button>

            </div>

        </section>

    </main>

</div>

<script src="../js/torque.js"></script>

</body>

</html>
