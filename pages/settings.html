<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#C1121F">
    <meta name="description" content="Air Tahiti Tools settings">
    <title>Settings — Air Tahiti Tools</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/icons/logo.png">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <div class="settings-page">
        <header class="settings-header">
            <a class="back-button" href="../index.html" aria-label="Back to home">‹</a>
            <div>
                <p class="eyebrow">AIR TAHITI TOOLS</p>
                <h1>Settings</h1>
            </div>
        </header>

        <main class="settings-content">
            <section class="settings-section" aria-labelledby="appearance-title">
                <div class="section-heading">
                    <h2 id="appearance-title">Appearance</h2>
                    <p>Choose how the application looks.</p>
                </div>

                <div class="theme-options" role="group" aria-label="Theme">
                    <button class="theme-option" type="button" data-theme="system">
                        <span class="theme-option-icon">◐</span>
                        <span>
                            <strong>System</strong>
                            <small>Follow device settings</small>
                        </span>
                    </button>
                    <button class="theme-option" type="button" data-theme="light">
                        <span class="theme-option-icon">☀</span>
                        <span>
                            <strong>Light</strong>
                            <small>Bright interface</small>
                        </span>
                    </button>
                    <button class="theme-option" type="button" data-theme="dark">
                        <span class="theme-option-icon">☾</span>
                        <span>
                            <strong>Dark</strong>
                            <small>Low-light interface</small>
                        </span>
                    </button>
                </div>
            </section>

            <section class="settings-section" aria-labelledby="language-title">
                <div class="section-heading">
                    <h2 id="language-title">Language</h2>
                    <p>The interface language will be expanded in a future update.</p>
                </div>
                <div class="setting-row">
                    <span>Application language</span>
                    <span class="setting-value">Français</span>
                </div>
            </section>

            <section class="settings-section" aria-labelledby="app-title">
                <div class="section-heading">
                    <h2 id="app-title">Application</h2>
                    <p>Air Tahiti Tools maintenance utilities.</p>
                </div>
                <div class="setting-row">
                    <span>Version</span>
                    <span class="setting-value">1.1.0</span>
                </div>
                <div class="setting-row">
                    <span>Offline mode</span>
                    <span class="status-badge">Enabled</span>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/settings.js"></script>
</body>
</html>
