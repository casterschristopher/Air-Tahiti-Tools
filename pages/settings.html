<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Settings</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="../css/settings.css">

</head>

<body class="theme-red">

<div class="app">

    <header class="fuel-header">

        <div class="fuel-title">

            <h1>Settings</h1>

            <p>Application Preferences</p>

        </div>

        <a href="../index.html" class="secondary-button">
            Home
        </a>

    </header>

    <main class="page-settings">

        <section class="settings-card">

            <div class="setting-group">

                <label for="theme">
                    Theme
                </label>

                <select id="theme">

                    <option value="red">🌺 Red Island</option>

                    <option value="black">🌑 Black Pearl</option>

                </select>

            </div>

            <div class="setting-group">

                <label for="language">
                    Language
                </label>

                <select id="language">

                    <option value="en">English</option>

                    <option value="fr">Français</option>

                </select>

            </div>

            <div class="setting-group">

                <label for="densityDefault">

                    Default Jet A-1 Density

                </label>

                <input
                    id="densityDefault"
                    type="number"
                    step="0.001"
                    min="0.700"
                    max="0.850">

            </div>

            <div class="button-row">

                <button
                    id="saveButton"
                    class="primary-button">

                    Save

                </button>

                <button
                    id="resetButton"
                    class="secondary-button">

                    Reset

                </button>

            </div>

        </section>

    </main>

</div>

<script src="../js/settings.js"></script>

</body>

</html>
