<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Air Tahiti Tools</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.svg" alt="Air Tahiti Logo">
        </header>

        <main>
            <div class="menu-card" onclick="alert('Module Fuel')">
                <div class="icon-box"><i class="fas fa-gas-pump"></i></div>
                <div class="card-content">
                    <h3>FUEL TOOLS</h3>
                    <p>Converter • Uplift</p>
                </div>
                <div class="chevron">❯</div>
            </div>

            <div class="menu-card" onclick="alert('Module Torque')">
                <div class="icon-box"><i class="fas fa-wrench"></i></div>
                <div class="card-content">
                    <h3>TORQUE & UNITS</h3>
                    <p>Torque • Length • Pressure</p>
                </div>
                <div class="chevron">❯</div>
            </div>

            <div class="menu-card" onclick="toggleTheme()">
                <div class="icon-box"><i class="fas fa-cog"></i></div>
                <div class="card-content">
                    <h3>SETTINGS</h3>
                    <p>Theme • Language</p>
                </div>
                <div class="chevron">❯</div>
            </div>
        </main>

        <footer>
            <p style="color:var(--accent); font-weight:bold; margin-top:30px;">VERSION 1.0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
