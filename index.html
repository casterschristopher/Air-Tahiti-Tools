ground:#ffffffed;color:#10243a;border:1px solid #dedbd2;text-align:center;font-size:9.5px;font-weight:800;line-height:1.3}.footer{text-align:center;font-size:8.5px;color:#fff;padding:9px 0 1px;text-shadow:0 1px 5px #0008}@media(max-width:390px){.app{padding-left:10px;padding-right:10px;padding-top:clamp(410px,116vw,590px)}.card{height:100px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}</style></head><body><main class="app"><section class="grid"><a class="card" href="pages/fuel.html" aria-label="Fuel Tools"><img src="assets/menu/Fuel_Tools.jpeg?v=2" alt="Fuel Tools"></a><a class="card" href="pages/torque.html" aria-label="Torque & Units"><img src="assets/menu/torque.jpg?v=2" alt="Torque & Units"></a><a class="card" href="pages/alpha-callup.html" aria-label="Alpha Call-Up"><img src="assets/menu/alpha.jpg?v=3" alt="Alpha Call-Up"></a><a class="card" href="pages/outillage-magasin.html" aria-label="Outillage Magasin"><img src="assets/menu/store.jpg?v=3" alt="Outillage Magasin"></a><a class="card" href="#" aria-label="Documentation"><img src="assets/menu/docs.jpg?v=3" alt="Documentation"></a><a class="card" href="#" aria-label="Calculators"><img src="assets/menu/calc.jpg?v=3" alt="Calculators"></a><a class="card" href="#" aria-label="Aircraft Systems"><img src="assets/menu/systems.jpg?v=3" alt="Aircraft Systems"></a><a class="card" href="pages/settings.html" aria-label="Settings"><img src="assets/menu/settings.jpg?v=3" alt="Settings"></a></section><div class="safety">⚠️ Always refer to the applicable AMM/IPC/approved maintenance data before performing maintenance.</div><footer class="footer">Air Tahiti Tools • Maintenance Support • ATR 42 / ATR 72</footer></main><script src="js/app.js?v=3"></script><script>(function(){const cards=[...document.querySelectorAll('.card')];let ticking=false;let lastY=window.scrollY||0;function update(){const y=window.scrollY||0;const delta=y-lastY;lastY=y;cards.forEach((card,i)=>{const r=card.getBoundingClientRect();if(r.bottom<-120||r.top>window.innerHeight+120)return;const center=r.top+r.height/2;const distance=(center-window.innerHeight/2)/window.innerHeight;const base=Math.max(-32,Math.min(32,-distance*32));const inertia=Math.max(-12,Math.min(12,-delta*0.9));const direction=i%2===0?1:-1;card.style.transform='translate3d(0,'+(base+inertia*direction).toFixed(1)+'px,0)'}) ;ticking=false}function requestUpdate(){if(!ticking){requestAnimationFrame(update);ticking=true}}window.addEventListener('scroll',requestUpdate,{passive:true});window.addEventListener('touchmove',requestUpdate,{passive:true});window.addEventListener('resize',requestUpdate,{passive:true});update()})();</script></body></html>
