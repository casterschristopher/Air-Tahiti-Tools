<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Tahiti Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: all 0.3s ease; }
        .red-island { background-color: #F8F8F8; color: black; }
        .black-pearl { background-color: #000000; color: white; }
        .card { border-radius: 24px; transition: transform 0.1s; }
        .card:active { transform: scale(0.98); }
        .icon-circle { background-color: #C41E3A; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .accent-red { color: #C41E3A; }
        .bg-card-dark { background-color: #1C1C1E; }
    </style>
</head>
<body id="body" class="red-island min-h-screen">

    <div class="flex flex-col items-center pt-12 px-6 pb-20">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="border-4 border-[#C41E3A] rounded-full w-24 h-24 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-plane-up text-[#C41E3A] text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black tracking-widest accent-red">AIR TAHITI</h1>
            <h2 class="text-xl font-bold accent-red mt-[-5px]">— TOOLS —</h2>
            <p class="text-[10px] font-bold mt-2 opacity-70 tracking-tighter uppercase">Aircraft Maintenance Toolbox</p>
        </div>

        <!-- Menu -->
        <div class="w-full max-w-md space-y-5">
            <!-- Fuel Tools -->
            <div class="card bg-white shadow-lg p-5 flex items-center black-pearl-card" onclick="alert('Module Fuel')">
                <div class="icon-circle text-white text-2xl shrink-0"><i class="fa-solid fa-gas-pump"></i></div>
                <div class="ml-4 flex-grow">
                    <h3 class="font-bold text-lg">FUEL TOOLS</h3>
                    <p class="text-gray-400 text-sm">Converter • Uplift</p>
                </div>
                <i class="fa-solid fa-chevron-right accent-red text-xl"></i>
            </div>

            <!-- Torque Tools -->
            <div class="card bg-white shadow-lg p-5 flex items-center black-pearl-card">
                <div class="icon-circle text-white text-2xl shrink-0"><i class="fa-solid fa-wrench"></i></div>
                <div class="ml-4 flex-grow">
                    <h3 class="font-bold text-lg uppercase">Torque & Units</h3>
                    <p class="text-gray-400 text-sm">Torque • Length<br>Pressure • Mass</p>
                </div>
                <i class="fa-solid fa-chevron-right accent-red text-xl"></i>
            </div>

            <!-- Settings / Toggle Theme -->
            <div class="card bg-white shadow-lg p-5 flex items-center black-pearl-card" onclick="toggleTheme()">
                <div class="icon-circle text-white text-2xl shrink-0"><i class="fa-solid fa-gear"></i></div>
                <div class="ml-4 flex-grow">
                    <h3 class="font-bold text-lg">SETTINGS</h3>
                    <p class="text-gray-400 text-sm">Theme (Switch) • Language</p>
                </div>
                <i class="fa-solid fa-chevron-right accent-red text-xl"></i>
            </div>
        </div>

        <div class="mt-12">
            <p class="accent-red font-bold text-sm tracking-widest">VERSION 1.0</p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.getElementById('body');
            const cards = document.querySelectorAll('.black-pearl-card');
            
            if (body.classList.contains('red-island')) {
                body.classList.replace('red-island', 'black-pearl');
                cards.forEach(c => c.style.backgroundColor = '#1C1C1E');
            } else {
                body.classList.replace('black-pearl', 'red-island');
                cards.forEach(c => c.style.backgroundColor = '#FFFFFF');
            }
        }
    </script>
</body>
</html>
