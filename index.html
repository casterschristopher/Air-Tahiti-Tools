<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Tahiti Tools</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo-wrapper">
                <img src="assets/images/logo.svg" alt="Logo ATR Air Tahiti" class="logo">
            </div>
            <h1>Air Tahiti Tools</h1>
            <p class="subtitle">Aircraft Maintenance Toolbox</p>
        </header>

        <!-- MENU NAVIGATION -->
        <nav class="menu">
            <!-- Item Fuel -->
            <a href="#" class="menu-item">
                <div class="icon-box">
                    <img src="assets/icons/fuel.svg" alt="Fuel">
                </div>
                <div class="item-text">
                    <span class="item-title">Fuel Tools</span>
                    <span class="item-desc">Converter • Uplift</span>
                </div>
                <div class="chevron"></div>
            </a>

            <!-- Item Torque -->
            <a href="#" class="menu-item">
                <div class="icon-box">
                    <img src="assets/icons/torque.svg" alt="Torque">
                </div>
                <div class="item-text">
                    <span class="item-title">Torque & Units</span>
                    <span class="item-desc">Torque • Length • Pressure • Mass • Temperature</span>
                </div>
                <div class="chevron"></div>
            </a>

            <!-- Item Settings -->
            <a href="#" class="menu-item">
                <div class="icon-box">
                    <img src="assets/icons/settings.svg" alt="Settings">
                </div>
                <div class="item-text">
                    <span class="item-title">Settings</span>
                    <span class="item-desc">Theme • Language • Fuel Density</span>
                </div>
                <div class="chevron"></div>
            </a>
        </nav>

        <!-- FOOTER VERSION -->
        <footer class="footer">
            <div class="version-bar">Version 1.0</div>
        </footer>
    </div>

</body>
</html>
