<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Air Tahiti Tools</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <img src="logo.svg" alt="Air Tahiti Logo">
            <p class="toolbox-label">AIRCRAFT MAINTENANCE TOOLBOX</p>
        </header>

        <nav class="menu-list">
            <button class="card" onclick="alert('Module Fuel en cours de développement')">
                <div class="icon-circle"><i class="fas fa-gas-pump"></i></div>
                <div class="card-info">
                    <h3>FUEL TOOLS</h3>
                    <p>Converter • Uplift</p>
                </div>
                <span class="chevron">❯</span>
            </button>

            <button class="card" onclick="alert('Module Torque en cours de développement')">
                <div class="icon-circle"><i class="fas fa-wrench"></i></div>
                <div class="card-info">
                    <h3>TORQUE & UNITS</h3>
                    <p>Torque • Length<br>Pressure • Mass • Temp</p>
                </div>
                <span class="chevron">❯</span>
            </button>

            <button class="card" onclick="toggleTheme()">
                <div class="icon-circle"><i class="fas fa-cog"></i></div>
                <div class="card-info">
                    <h3>SETTINGS</h3>
                    <p>Theme • Language<br>Fuel Density</p>
                </div>
                <span class="chevron">❯</span>
            </button>
        </nav>

        <div class="version">VERSION 1.0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
