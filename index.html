<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Air Tahiti Tools</title>

    <meta name="theme-color" content="#C8102E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Air Tahiti Tools">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-light">

<div class="background-pattern"></div>

<div class="app">

    <header class="app-header">

        <img
            src="assets/images/logo.svg"
            alt="Air Tahiti Tools"
            class="logo">

        <div class="title-group">
            <h1>Air Tahiti Tools</h1>

            <p class="subtitle">
                Aircraft Maintenance Toolbox
            </p>
        </div>

    </header>

    <main class="dashboard">

        <a href="pages/fuel.html" class="card">

            <div class="card-icon">
                <img src="assets/icons/fuel.svg" alt="Fuel Tools">
            </div>

            <div class="card-content">

                <h2>Fuel Tools</h2>

                <p>Converter • Uplift</p>

            </div>

            <span class="card-arrow">›</span>

        </a>

        <a href="pages/torque.html" class="card">

            <div class="card-icon">
                <img src="assets/icons/torque.svg" alt="Torque & Units">
            </div>

            <div class="card-content">

                <h2>Torque & Units</h2>

                <p>Torque • Length • Pressure • Mass • Temperature</p>

            </div>

            <span class="card-arrow">›</span>

        </a>

        <a href="pages/settings.html" class="card">

            <div class="card-icon">
                <img src="assets/icons/settings.svg" alt="Settings">
            </div>

            <div class="card-content">

                <h2>Settings</h2>

                <p>Theme • Language • Fuel Density</p>

            </div>

            <span class="card-arrow">›</span>

        </a>

    </main>

    <footer class="footer">
        Version 1.0
    </footer>

</div>

<script src="js/app.js"></script>

</body>
</html>
