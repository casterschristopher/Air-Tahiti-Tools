<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond (Optionnel) -->
  <rect width="800" height="400" fill="transparent"/>

  <!-- Groupe Emblème Circulaire -->
  <g transform="translate(50, 50)">
    <!-- Cercle extérieur noir avec coupure pour la fleur -->
    <path d="M 280 150 A 130 130 0 1 0 50 250" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <path d="M 50 250 A 130 130 0 0 0 280 150" fill="none" stroke="#C41E3A" stroke-width="8" stroke-linecap="round"/>

    <!-- Disque de fond avec motif tribal simplifié -->
    <circle cx="165" cy="165" r="120" fill="#1A1A1A"/>
    <g opacity="0.4">
      <path d="M 100 100 L 230 230 M 100 230 L 230 100" stroke="white" stroke-width="2"/>
      <circle cx="165" cy="165" r="80" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10 5"/>
      <circle cx="165" cy="165" r="50" fill="none" stroke="white" stroke-width="1"/>
      <path d="M 165 45 V 285 M 45 165 H 285" stroke="white" stroke-width="1"/>
    </g>

    <!-- Silhouette de l'avion (Style ATR) -->
    <path d="M 50 160 L 150 185 L 340 100 L 350 115 L 180 220 L 200 270 L 180 275 L 155 215 L 50 185 Z" 
          fill="white" stroke="black" stroke-width="2"/>
    <circle cx="210" cy="180" r="4" fill="black"/> <!-- Hublot avant -->

    <!-- Fleur d'Hibiscus Rouge -->
    <g transform="translate(40, 240) scale(1.2)">
      <!-- Pétales -->
      <path d="M 0 0 C -20 -30 -50 -20 -45 10 C -40 40 -10 35 0 0" fill="#E31E24"/>
      <path d="M 0 0 C 20 -30 50 -20 45 10 C 40 40 10 35 0 0" fill="#E31E24"/>
      <path d="M 0 0 C -30 10 -35 40 -10 50 C 15 60 25 30 0 0" fill="#C41E3A"/>
      <path d="M 0 0 C 30 10 35 40 10 50 C -15 60 -25 30 0 0" fill="#C41E3A"/>
      <path d="M 0 0 C -10 -40 10 -40 0 0" fill="#E31E24"/>
      <!-- Pistil -->
      <path d="M 0 0 L 10 -40" stroke="white" stroke-width="2" fill="none"/>
      <circle cx="12" cy="-45" r="3" fill="white"/>
      <circle cx="5" cy="-42" r="2" fill="white"/>
      <circle cx="18" cy="-38" r="2" fill="white"/>
    </g>
  </g>

  <!-- Texte AIR TAHITI -->
  <text x="320" y="200" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="75" fill="black" letter-spacing="-2">
    AIR TAHITI
  </text>

  <!-- Texte TOOLS avec lignes -->
  <g transform="translate(320, 260)">
    <line x1="0" y1="-15" x2="100" y2="-15" stroke="#C41E3A" stroke-width="3"/>
    <text x="110" y="0" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" fill="#C41E3A">
      TOOLS
    </text>
    <line x1="360" y1="-15" x2="460" y2="-15" stroke="#C41E3A" stroke-width="3"/>
  </g>
</svg>
