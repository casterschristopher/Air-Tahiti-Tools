name: Deploy extracted torque schematics
on:
  push:
    paths:
      - 'assets/torque_upload/torque_assets.b64'
      - '.github/workflows/deploy-torque-assets.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract assets
        run: |
          mkdir -p assets/torque
          base64 -d assets/torque_upload/torque_assets.b64 > /tmp/torque.zip
          unzip -o /tmp/torque.zip -d assets/torque
          rm -f /tmp/torque.zip assets/torque_upload/torque_assets.b64
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/torque assets/torque_upload/torque_assets.b64
          git diff --cached --quiet || git commit -m 'Deploy extracted torque schematics'
          git push